# dvoid (org-specific) — build a self-host AFFiNE image from THIS fork and push
# it to ghcr.io/dvoid-io/affine. Unlike upstream's release.yml (multi-arch,
# multi-job, GKE deploy), this is a single linux/amd64 job tuned for Railway,
# which pulls the image directly. Building from the fork is the whole point:
# it compiles in our `patch/oidc-token-exchange` server plugin, which the
# upstream prebuilt image (ghcr.io/toeverything/affine:stable) does not contain.
#
# The build faithfully mirrors upstream's build-images.yml job graph
# (build-server-native -> build-server, build-web/admin/mobile, build-images),
# collapsed into one job because we only target a single architecture.
name: dvoid · Build self-host AFFiNE image

on:
  push:
    branches:
      - deploy/production
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  # Single arch — Railway runs amd64.
  TARGET: x86_64-unknown-linux-gnu
  # Self-host build channel. Upstream's frontend rspack config requires
  # BUILD_TYPE ∈ {canary,beta,stable,internal}; `stable` yields a clean
  # self-host bundle (tools/cli/src/rspack/index.ts validates this).
  BUILD_TYPE: stable

jobs:
  build-image:
    name: Build & push ghcr.io/dvoid-io/affine
    runs-on: ubuntu-22.04
    environment: production
    steps:
      - uses: actions/checkout@v6

      # --- Toolchain (matches upstream) ----------------------------------
      # Node 22.22.3 (.nvmrc), Yarn 4.13.0 via corepack, full yarn install.
      # setup-node composite reads .nvmrc and runs `yarn --immutable`.
      - name: Setup Node.js + yarn install
        uses: ./.github/actions/setup-node
        with:
          electron-install: false

      # --- 1. Native module (@affine/server-native, napi/Rust) -----------
      # Upstream build-server-native job. build-rust composite reads
      # rust-toolchain.toml (channel 1.96.0), sets CC=clang -D_BSD_SOURCE,
      # and runs `yarn workspace @affine/server-native build --target <t>`.
      # For x86_64 it does NOT use --use-napi-cross (native compile).
      - name: Build server-native (Rust napi)
        uses: ./.github/actions/build-rust
        env:
          AFFINE_PRO_PUBLIC_KEY: ${{ secrets.AFFINE_PRO_PUBLIC_KEY }}
          AFFINE_PRO_LICENSE_AES_KEY: ${{ secrets.AFFINE_PRO_LICENSE_AES_KEY }}
        with:
          target: x86_64-unknown-linux-gnu
          package: '@affine/server-native'

      # `napi build` emits packages/backend/native/server-native.node.
      # Upstream renames it to the arch-tagged name; docker-clean.mjs keeps
      # `server-native.x64.node` for TARGETARCH=amd64 and index.js falls back
      # to it. Rename so the binary survives the docker-clean prune.
      - name: Rename native binary -> server-native.x64.node
        run: |
          mv ./packages/backend/native/server-native.node \
             ./packages/backend/native/server-native.x64.node
          ls -alh ./packages/backend/native

      # --- 2. Server (our plugin compiles in here) -----------------------
      # Upstream build-server job: `yarn workspace @affine/server build`
      # (which is `affine bundle -p @affine/server`). Produces
      # packages/backend/server/dist (including ./dist/main.js).
      - name: Build @affine/server
        run: yarn workspace @affine/server build

      # --- 3. Frontend dists (web, admin, mobile) ------------------------
      # Upstream build-web/build-admin/build-mobile jobs. BUILD_TYPE drives
      # the rspack channel. Sentry/Perfsee/R2 secrets are optional — they
      # only enable sourcemap upload / asset CDN; absence is non-fatal.
      - name: Build @affine/web
        run: yarn affine @affine/web build
        env:
          BUILD_TYPE: ${{ env.BUILD_TYPE }}

      - name: Build @affine/admin
        run: yarn affine @affine/admin build
        env:
          BUILD_TYPE: ${{ env.BUILD_TYPE }}

      - name: Build @affine/mobile
        run: yarn affine @affine/mobile build
        env:
          BUILD_TYPE: ${{ env.BUILD_TYPE }}

      # --- 4. Production node_modules + Prisma (mirrors build-images) -----
      # Re-resolve a production-only dependency tree into the root
      # node_modules, then move it under the server package so the Dockerfile
      # (which COPYs packages/backend/server) ships runtime deps + the native
      # binary. amd64-only architectures keep the install lean.
      - name: Install production dependencies
        run: |
          yarn config set --json supportedArchitectures.cpu '["x64"]'
          yarn config set --json supportedArchitectures.libc '["glibc"]'
          yarn workspaces focus @affine/server --production

      - name: Generate Prisma client
        run: yarn workspace @affine/server prisma generate

      - name: Move node_modules into server package
        run: mv ./node_modules ./packages/backend/server

      # --- 5. Login + build/push image -----------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          logout: false
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Mirrors upstream's docker/build-push-action. Single-arch (amd64).
      # BuildKit injects TARGETARCH=amd64, which docker-clean.mjs reads to
      # keep server-native.x64.node + the debian prisma engine.
      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .github/deployment/node/Dockerfile
          platforms: linux/amd64
          push: true
          pull: true
          provenance: false
          tags: |
            ghcr.io/dvoid-io/affine:deploy-production
            ghcr.io/dvoid-io/affine:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
